[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwcopilot"
version = "0.1.0"
description = "A firmware engineering AI assistant that understands your project, your board, and your ICs' datasheets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.60",
    "pypdf>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.4"]

[project.scripts]
fwcopilot = "fwcopilot.cli:main"
fwc = "fwcopilot.cli:main"

[tool.setuptools.packages.find]
include = ["fwcopilot*"]

[tool.setuptools.package-data]
fwcopilot = ["web/*.html", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
